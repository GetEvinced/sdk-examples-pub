plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()

    // Evinced JFrog – resolve only
    maven {
        url = uri("https://evinced.jfrog.io/artifactory/restricted-maven")
        credentials {
            username = System.getenv("EVINCED_ARTIFACTORY_USER")
            password = System.getenv("EVINCED_ARTIFACTORY_TOKEN")
        }
    }
}

dependencies {
    testImplementation "com.microsoft.playwright:playwright:1.41.0"
    testImplementation "com.evinced:java-playwright-sdk:1.6.1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
}

test {
    useJUnitPlatform()
    // Fork a new JVM for every test class. SDK 1.6.1 maintains JVM-global scan
    // state that causes evStop() to hang when multiple classes share one JVM.
    forkEvery = 1
    maxParallelForks = 1
}
