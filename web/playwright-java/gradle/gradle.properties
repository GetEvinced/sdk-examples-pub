# Force the Gradle daemon to run on JDK 17.
# Gradle 8.7 bundles Groovy 3, which cannot process class files compiled with
# JDK 25 (class file major version 69). Running the daemon on JDK 17 keeps
# Groovy's semantic analysis happy and allows forkEvery to be configured.
# The test toolchain (build.gradle) independently pins test execution to JDK 17.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
