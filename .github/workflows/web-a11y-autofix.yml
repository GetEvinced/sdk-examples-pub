name: A11y Auto-Fix — Cross-Repo

on:
  workflow_run:
    workflows: ["Web SDK Tests — JavaScript/TypeScript"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip git push / gh pr create / gh pr comment; log no-ops instead"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: a11y-autofix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      issue_count: ${{ steps.list.outputs.count }}
      target_owner: ${{ steps.cfg.outputs.target_owner }}
      target_repo: ${{ steps.cfg.outputs.target_repo }}
      target_branch: ${{ steps.cfg.outputs.target_branch }}
      report_basename: ${{ steps.cfg.outputs.report_basename }}
      report_artifact: ${{ steps.cfg.outputs.report_artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pipeline config
        id: cfg
        run: |
          echo "target_owner=$(jq -r .target.owner a11y-autofix.config.json)" >> "$GITHUB_OUTPUT"
          echo "target_repo=$(jq -r .target.repo a11y-autofix.config.json)" >> "$GITHUB_OUTPUT"
          echo "target_branch=$(jq -r .target.baseBranch a11y-autofix.config.json)" >> "$GITHUB_OUTPUT"
          echo "report_artifact=$(jq -r .reportArtifactName a11y-autofix.config.json)" >> "$GITHUB_OUTPUT"
          echo "report_basename=$(basename $(jq -r .reportPath a11y-autofix.config.json))" >> "$GITHUB_OUTPUT"

      - name: Download issues artifact (from triggering workflow run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.report_artifact }}
          path: ./_autofix_input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download latest issues artifact (schedule / manual dispatch)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./_autofix_input
          RUN_ID=$(gh run list \
            -R ${{ github.repository }} \
            --workflow "Web SDK Tests — JavaScript/TypeScript" \
            --branch ${{ github.ref_name }} \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful web-js.yml run found on ${{ github.ref_name }}"
            exit 1
          fi
          echo "Downloading from run-id=$RUN_ID"
          gh run download "$RUN_ID" \
            -R ${{ github.repository }} \
            --name "${{ steps.cfg.outputs.report_artifact }}" \
            --dir ./_autofix_input

      - name: Re-upload issues artifact for matrix jobs
        uses: actions/upload-artifact@v4
        with:
          name: a11y-issues-staged
          path: ./_autofix_input/${{ steps.cfg.outputs.report_basename }}
          retention-days: 1

      - name: Build matrix from issue signatures
        id: list
        run: |
          FILE="./_autofix_input/${{ steps.cfg.outputs.report_basename }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Issues file not found at $FILE"
            exit 1
          fi
          # Recursive scan for `signature` fields anywhere in the JSON structure.
          SIGNATURES=$(jq -c '[.. | objects | select(has("signature")) | .signature] | unique' "$FILE")
          COUNT=$(echo "$SIGNATURES" | jq 'length')
          if [ "$COUNT" = "0" ]; then
            echo "::warning::No issue signatures found in $FILE"
          fi
          MATRIX=$(jq -nc --argjson sigs "$SIGNATURES" '{signature: $sigs}')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT issue signatures"

  fix:
    needs: extract
    if: needs.extract.outputs.issue_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.extract.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download staged issues artifact
        uses: actions/download-artifact@v4
        with:
          name: a11y-issues-staged
          path: ./_autofix_input

      - name: Clone target FE repo
        env:
          GH_TOKEN: ${{ secrets.DEMO_FE_PAT }}
        run: |
          gh repo clone "${{ needs.extract.outputs.target_owner }}/${{ needs.extract.outputs.target_repo }}" ./_autofix_target -- \
            --branch "${{ needs.extract.outputs.target_branch }}" --depth 50
          cd ./_autofix_target
          git config user.email "a11y-autofix@evinced.com"
          git config user.name  "Evinced A11y Autofix"

      - name: Configure .npmrc for Evinced private registry
        run: echo "${{ secrets.EVINCED_NPM_TOKEN }}" > ~/.npmrc

      - name: Install Evinced MCP server (skip broken postinstall scripts)
        run: |
          # @evinced/mcp-server-web@1.0.28's postinstall tries to run
          # `vite build` (devDep, not present after `npm install`) and pulls
          # `keytar` which fails to prebuild on a fresh runner. We use token
          # auth (env vars), not the OS-keychain login flow, so keytar isn't
          # needed at runtime. Skip both with --ignore-scripts and
          # --omit=optional.
          npm install -g @evinced/mcp-server-web --ignore-scripts --omit=optional

          echo "--- discovering binary name ---"
          NODE_BIN_DIR="$(dirname $(which node))"
          ls -la "$NODE_BIN_DIR" | grep -i evinced || echo "no evinced binary on PATH"
          ls -la "$NODE_BIN_DIR" | grep -i mcp || echo "no mcp binary on PATH"

          echo "--- package directory ---"
          PKG_DIR="$NODE_BIN_DIR/../lib/node_modules/@evinced/mcp-server-web"
          if [ -d "$PKG_DIR" ]; then
            echo "package installed at $PKG_DIR"
            cat "$PKG_DIR/package.json" | jq '.bin, .main' || true
          else
            echo "::error::package not found at $PKG_DIR"
          fi

      - name: Load agent prompt for this signature
        id: load_prompt
        env:
          SIGNATURE: ${{ matrix.signature }}
        run: |
          # Substitute __SIGNATURE__ placeholder in the prompt template
          PROMPT=$(sed "s|__SIGNATURE__|$SIGNATURE|g" prompts/a11y-autofix.md)
          {
            echo 'content<<PROMPT_EOF'
            echo "$PROMPT"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude agent for signature ${{ matrix.signature }}
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          direct_prompt: ${{ steps.load_prompt.outputs.content }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.DEMO_FE_PAT }}
          allowed_tools: "Bash,Edit,MultiEdit,Glob,Grep,LS,Read,Write,mcp__evinced__evinced_get_webpage_issue_details,mcp__evinced__evinced_analyze_webpage,mcp__evinced__evinced_import_report"
          claude_env: |
            REPORT_PATH: ${{ github.workspace }}/_autofix_input/${{ needs.extract.outputs.report_basename }}
            TARGET_REPO_PATH: ${{ github.workspace }}/_autofix_target
            CONFIG_PATH: ${{ github.workspace }}/a11y-autofix.config.json
            DRY_RUN: ${{ inputs.dry_run || 'false' }}
            SIGNATURE: ${{ matrix.signature }}
            GH_TOKEN: ${{ secrets.DEMO_FE_PAT }}
          mcp_config: |
            {
              "mcpServers": {
                "evinced": {
                  "command": "npx",
                  "args": ["-y", "@evinced/mcp-server-web", "--headless"],
                  "type": "stdio",
                  "env": {
                    "EVINCED_SERVICE_ID": "${{ secrets.EVINCED_SERVICE_ID }}",
                    "EVINCED_API_KEY": "${{ secrets.EVINCED_API_KEY }}"
                  }
                }
              }
            }

  summary:
    needs: [extract, fix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ needs.fix.result || 'skipped' }}
          channel: "#workflows"
          message: |
            a11y autofix — ${{ needs.fix.result || 'skipped' }} (${{ needs.extract.outputs.issue_count || 0 }} issues processed)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
