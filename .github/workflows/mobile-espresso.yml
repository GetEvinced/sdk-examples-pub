name: Mobile SDK Tests — Espresso/Gradle (Sauce Labs)

on:
  push:
    branches: [sdk-examples-pub-v2, main]
    paths:
      - 'mobile/espresso-gradle/**'
      - '.github/workflows/mobile-espresso.yml'
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build APKs
        working-directory: mobile/espresso-gradle
        run: gradle assembleDebug assembleDebugAndroidTest

      - name: Upload demo APK to Sauce Labs storage
        env:
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          COUNT=$(curl -sf -u "$SAUCE_USER:$SAUCE_ACCESS_KEY" \
            "https://api.us-west-1.saucelabs.com/v1/storage/files?q=com.evinced.demoapp-MK.apk" | \
            jq '.totalItems // 0')
          if [ "$COUNT" -eq "0" ]; then
            echo "APK not found in Sauce Labs storage, uploading..."
            curl -u "$SAUCE_USER:$SAUCE_ACCESS_KEY" \
              -X POST "https://api.us-west-1.saucelabs.com/v1/storage/upload" \
              -H "Content-Type: multipart/form-data" \
              -F "payload=@mobile/wdio/com.evinced.demoapp-MK.apk" \
              -F "name=com.evinced.demoapp-MK.apk"
          else
            echo "APK already in Sauce Labs storage (${COUNT} file(s)), skipping upload."
          fi

      - name: Install saucectl
        run: |
          curl -fsSL https://saucelabs.github.io/saucectl/install | bash
          saucectl --version

      - name: Run Espresso tests on Sauce Labs
        working-directory: mobile/espresso-gradle
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USER }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          EVINCED_SERVICE_ID: ${{ secrets.EVINCED_SERVICE_ID }}
          EVINCED_API_KEY: ${{ secrets.EVINCED_API_KEY }}
        run: saucectl run

      - name: Notify Slack
        if: always()
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          channel: "#workflows"
          message: "mobile/espresso-gradle — ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
