name: Mobile SDK Tests — JavaScript (Sauce Labs)

on:
  push:
    branches: [sdk-examples-pub-v2, main]
    paths:
      - 'mobile/wdio/**'
      - '.github/workflows/mobile-js.yml'
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure .npmrc
        run: echo "${{ secrets.EVINCED_NPM_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        working-directory: mobile/wdio
        run: npm install

      - name: Upload APK to Sauce Labs storage
        working-directory: mobile/wdio
        env:
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          COUNT=$(curl -sf -u "$SAUCE_USER:$SAUCE_ACCESS_KEY" \
            "https://api.us-west-1.saucelabs.com/v1/storage/files?q=com.evinced.demoapp-MK.apk" | \
            jq '.totalItems // 0')
          if [ "$COUNT" -eq "0" ]; then
            echo "APK not found in Sauce Labs storage, uploading..."
            curl -u "$SAUCE_USER:$SAUCE_ACCESS_KEY" \
              -X POST "https://api.us-west-1.saucelabs.com/v1/storage/upload" \
              -H "Content-Type: multipart/form-data" \
              -F "payload=@com.evinced.demoapp-MK.apk" \
              -F "name=com.evinced.demoapp-MK.apk"
          else
            echo "APK already in Sauce Labs storage (${COUNT} file(s)), skipping upload."
          fi

      - name: Run tests on Sauce Labs
        working-directory: mobile/wdio
        env:
          EVINCED_SERVICE_ID: ${{ secrets.EVINCED_SERVICE_ID }}
          EVINCED_API_KEY: ${{ secrets.EVINCED_API_KEY }}
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: npm run wdio:sauce

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-mobile-wdio
          path: mobile/wdio/evinced-reports/**/*.html
          retention-days: 14

      - name: Notify Slack
        if: always()
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          channel: "#workflows"
          message: "mobile/wdio — ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
