name: Mobile SDK Tests — Java/Appium (Sauce Labs)

on:
  push:
    branches: [sdk-examples-pub-v2, main]
    paths:
      - 'mobile/appium/java/**'
      - '.github/workflows/mobile-jvm.yml'
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Run tests on Sauce Labs
        working-directory: mobile/appium/java
        env:
          EVINCED_SERVICE_ID: ${{ secrets.EVINCED_SERVICE_ID }}
          EVINCED_API_KEY: ${{ secrets.EVINCED_API_KEY }}
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: mvn test -B

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-mobile-appium-java
          path: mobile/appium/java/target/surefire-reports/
          retention-days: 14

      - name: Notify Slack
        if: always()
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          channel: "#workflows"
          message: "mobile/appium/java — ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
